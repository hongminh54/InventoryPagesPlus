# Add-fix GUI, opened from the fix list (Add Fix button).
# Support hex color: &#RRGGBB, #RRGGBB, <#RRGGBB>, {#RRGGBB}
# Item types: material / playerhead / customhead (see playerinventory.yml for details).
#
# Each column is one rule pair: old item in "old-slots", replacement in "new-slots"
# at the same list index. Press confirm to save every filled pair at once.
title: '&#00ff8cFix GUI'
size: 27

old-slots: [0, 1, 2, 3, 4, 5, 6, 7]
new-slots: [18, 19, 20, 21, 22, 23, 24, 25]
confirm-slot: 17
decor-slots: [8, 9, 10, 11, 12, 13, 14, 15, 16, 26]

items:
  confirm:
    type: material
    value: SUNFLOWER
    data: 0
    customModelData: 0
    name: '&#FFCC00Press to confirm Fix'
    lore:
      - ''
      - '&7Every filled column is saved as one rule.'
      - '&7The old item must have a custom name.'
      - ''
  decor:
    type: material
    value: BLACK_STAINED_GLASS_PANE
    data: 0
    customModelData: 0
    name: '&#fc3103Tips'
    lore:
      - ''
      - '&#fc3103Item above is the item to fix'
      - '&#fc3103Item below is the item it becomes after fix'
      - ''