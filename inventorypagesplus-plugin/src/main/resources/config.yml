# Use to show plugin information in order to support me fixing bugs.
# You might be asked to turn this on if you have plugin troubles. Otherwise, you don't have to turn this on.
debug:
  enabled: false
  prefix: '&e[INV.PAGES+ DEBUG] '

update-checker:
  enabled: true

# What based database will be used for storing player's inventory.
# Please restart server after you change this setting.
database:
  # H2, MYSQL, YAML
  # Loading database on H2/MYSQL is faster than YAML, so I recommend using H2/MYSQL.
  # For multiple server setups, use MYSQL.
  # For single server setup, use H2.
  type: H2
  settings:
    h2:
      file-name: 'h2Database'
      table: 'inventorydata'
      history-table: 'inventoryhistory'
    mysql:
      database:
        host: localhost
        port: 3306
        name: inventorypagesplus
        table: inventorydata
        history-table: inventoryhistory
        user: root
        password: ''

# Set the locale for all messages.
# To set language to English, set locale to en, to use the file "messages_en.yml" in folder "languages".
# You can create your own message file by following these steps:
#         1. copy messages_en.yml
#         2. paste it to folder languages with a new file name
#         3. file name must be: messages_<your locale>.yml
#         4. After you're done editing your message file, go back to config.yml and change "locale" to <your locale>
# Default languages available: en, vi
locale: vi

auto-save:
  enabled: true
  # Auto save database each...
  seconds: 900

backup-settings:
  # https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html
  file-name-date-format: 'HH-mm-ss MM-dd-yyyy'

inventory-settings:
  # Set to 0 if you don't want the players to have any additional pages.
  # Number lower than 0 is not acceptable.
  # ATTENTION: This will also set to players' database if they don't have database before.
  max-page-default: 1
  # The default position of "PrevItem"
  # ATTENTION: This will also set to players' database if they don't have database before.
  prev-item-position-default: 18
  # The default position of "NextItem"
  # ATTENTION: This will also set to players' database if they don't have database before.
  next-item-position-default: 26
  # If "focus-using-default-item-position" is true, then the position of the items "PrevItem" and "NextItem" of all players will be set as the default setting.
  # Additionally, they cannot customize their own items "PrevItem" and "NextItem" position.
  focus-using-default-item-position: false
  # If "use-saved-current-page" is true, then when player join the server, it will show the page that they were in before.
  # For example, at the time they leave the server they're in page 5, so when they rejoin, it will automatically show page 5.
  # If it false, then it always shows the first page when player join.
  use-saved-current-page: true
  # If "keep-inventory" is true then whenever players die, their items will not drop.
  # If it is false, then the players will need these permissions below to keep their items when they die.
  # inventorypagesplus.keep.unopened - When the player dies, keep unopened pages, and drop items in the current opening page.
  # inventorypagesplus.keep.hotbar - When the player dies, Keep all items in the hotbar.
  # inventorypagesplus.keep.all - Keep all items when player dies.
  keep-inventory: true
  # Keep player's experience and level if they die.
  keep-level: true
  # If this is enabled, plugin will show creative inventory database whenever player's mode changes to creative.
  # Otherwise, plugin will only use survival inventory database for all game modes.
  # PLEASE don't use reload command, please restart server after changing this option.
  use-creative-inventory: false
  # Shift+clicking a previous/next page button jumps directly to a typed page number
  # auto: dialog API on servers that support it (Paper 1.21.7+), chat input on older servers.
  # dialog: always use the dialog API (falls back to chat when unsupported).
  # chat: always type the page number in chat.
  # disabled: turn the feature off.
  page-jump: auto
  # These slots below won't be saved and loaded.
  # Player cannot use these slots for setting up the previous and next page items position.
  # Please do not set the default previous and next page item position to any of these slots.
  # Use this feature to support the plugin that use player inventory's slot to interact with its feature.
  # For example: MMOInventory,...
  # Set only -1 to disable
  skip-slots:
    - -1

# Protect virtual inventory pages with a PIN.
# Players must enter the PIN after every join before their pages are shown.
protection:
  enabled: true
  pin:
    min-length: 4
    max-length: 6
  # Wrong PINs allowed before a temporary ban.
  max-attempts: 5
  # Temporary ban duration in seconds. Set to 0 to disable the ban.
  ban-seconds: 300
  # Commands blocked while a player's pages are locked (root command names).
  # /pageprotect are always allowed so players can unlock. List aliases explicitly if needed.
  command-blacklist: []

history:
  enabled: true
  # Leave empty for one server. On shared MySQL, give each server a unique ID.
  # The viewer and maintenance only access records matching a non-empty server-id.
  server-id: ''
  # Numeric day/month/four-digit year with separators, for example dd-MM-yyyy or yyyy/MM/dd.
  date-format: 'dd-MM-yyyy'
  # Use one stable time zone on all servers sharing history storage.
  time-zone: 'Asia/Ho_Chi_Minh'
  snapshot:
    # 0 disables periodic snapshots. Negative values are not allowed.
    interval-seconds: 3600
    # Keep at 1-2 to spread capture work across ticks.
    players-per-tick: 1
    on-join: true
    on-quit: true
    on-disable: true
    before-clear: true
  retention:
    # Active history window in calendar months, clamped to 1-3.
    months: 3
    # ZIP: verify a local archive before deleting source records. DELETE: delete directly.
    # Archives are offline backups under history-archives, not browsable in the GUI.
    action: ZIP
    # Archives are deleted when ALL contained records are this many months old.
    # 0 keeps archives forever (disk usage then grows without an age limit).
    archive-keep-months: 12
    # Maintenance runs independently of recording, one bounded batch per interval.
    batch-size: 50
    interval-seconds: 60
  performance:
    # Queue changes require a restart. Overload fails safely rather than blocking ticks.
    max-pending-tasks: 64
    # Oversized records are rejected; existing oversized data is retained for recovery.
    max-record-megabytes: 8
  restore:
    # Restoring overwrites current page data, so it is disabled by default.
    enabled: false
  extraction:
    # Copying requires the restore permission declared in plugin.yml; history stays unchanged.
    enabled: true

# Permission based page limits.
# Node format: inventorypagesplus.slotpage.<suffix>
#   - A number suffix (inventorypagesplus.slotpage.5) grants 5 total pages.
#   - A rank suffix (inventorypagesplus.slotpage.vip) looks up that rank in "ranks" below.
# Players with inventorypagesplus.admin (or * / OP) have unlimited pages.
# The limit that applies is the LARGER of the permission one and the player's stored database value,
# so items are never lost when a rank expires.
page-permissions:
  # Default TOTAL pages for players without any slotpage permission (1 based: 3 means 3 pages).
  # "inventory-settings.max-page-default" still seeds the DATABASE value of brand new players
  # (legacy, 0 based). The larger of the two wins.
  default-max-page: 3
  # Text shown for %maxPage% and %totalpages% when the player has unlimited pages.
  unlimited-label: '&#55ff00∞'
  # Rank nodes: inventorypagesplus.slotpage.<key>
  # "max-page" is the TOTAL pages this rank grants (1 based).
  # "priority": the higher number wins when a player holds several ranks, and any rank overrides number nodes.
  ranks:
    vip:
      max-page: 5
      priority: 1
    premium:
      max-page: 6
      priority: 2
    ultimate:
      max-page: 7
      priority: 3

# Automatically move items to the next page if player's current page is full.
# However, Bukkit API does not let me execute the event when player's inventory is full.
# To fix this, player has to leave one slot empty in their page in order to allow the system to move items to the next page.
advanced-pick-up-settings:
  enabled: false
  action-bar:
    enabled: true
    text: '&f+%amount% %itemName%&r | Page: &e%page%&f | Slot: &e%slotNumber%'
  sound:
    enabled: true
    name: 'ENTITY_ITEM_PICKUP'
    volume: 1
    pitch: 1

# Automatically replace old items with new ones defined by admin rules.
# Rules are managed with /inventorypagesplus autofix (GUI) and stored in the data file below.
# The GUI layout is customized in inventories/autofixinventory.yml.
# When a rule is added, edited or removed, every player is scanned again on their next join.
autofix:
  enabled: true
  # Copy the enchantments of the old item onto the new one when fixing.
  toggle-enchant: true
  # File (inside the plugin data folder) storing rules and the list of already fixed players.
  data-file: 'autofix-data.yml'
  # How many online players are processed per tick when using "autofix force" without a target.
  # Keep this low so force-fixing everyone never hurts the TPS.
  players-per-tick: 1

# Using for collecting the number of players in the server.
# This option does not affect the server performance.
bStats:
  enabled: true