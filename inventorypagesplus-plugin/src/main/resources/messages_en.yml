#    For list strings, just put (- '').
#  * Support hex color: &#RRGGBB, #RRGGBB, <#RRGGBB>, {#RRGGBB}.

messages:
  prefix: '&#00ff8c[InventoryPagesPlus]&r '
  no-permission: '%prefix%&#fc3103You do not have the permission to use this command.'
  non-console-command: '%prefix%&#fc3103Console cannot use this command.'
  items-dropped: '%prefix%&#fc3103Too many items! Some items have been dropped.'
  invalid-number: '%prefix%&#fc3103Invalid number.'
  invalid-name: '%prefix%&#fc3103Player &e%player%&#fc3103 is not online.'
  get-player-data: '%prefix%&fGetting &e%player%''s&f database...'
  targets-database-doesnt-exist: '%prefix%&#fc3103Database of &e%player%&#fc3103 does not exist.'
  no-page-message: ''
  commands:
    inventorypagesplus:
      messages:
        - ' '
        - '&#00ff8cInventoryPagesPlus'
        - '&7Version %version%'
        - ' '
        - '&#00ff8c/inventorypagesplus reload &7- &fReload config, inventory, message'
        - '&#00ff8c/inventorypagesplus backup &7- &fBackup all current database to backup folder'
        - '&#00ff8c/inventorypagesplus setmaxpage &6<player> <amount> &7- &fSet max page number for...'
        - '&#00ff8c/inventorypagesplus addmaxpage &6<player> <amount> &7- &fAdd max page number for...'
        - '&#00ff8c/inventorypagesplus removemaxpage &6<player> <amount> &7- &fRemove max page number of...'
        - '&#00ff8c/inventorypagesplus autofix &7- &fOpen the item fix rules GUI'
        - '&#00ff8c/inventorypagesplus autofix reload &7- &fReload the fix rules and settings'
        - '&#00ff8c/inventorypagesplus autofix toggle &7- &fToggle the auto fix feature'
        - '&#00ff8c/inventorypagesplus autofix force &6(player) &7- &fFix one player or everyone online'
        - '&#00ff8c/inventorypagesplus autofix bypass &6(player) &7- &fToggle skipping AutoFix for a player'
        - ' '
        - ' &6<>&7: Cannot leave this block blank &7| &e()&7: Can leave this block blank'
      reload: '%prefix%&fReloaded InventoryPagesPlus successfully.'
      backup:
        start: '%prefix%&fBackup database...'
        complete: '%prefix%&fSuccessfully backed up database from %databaseType%! The backup database is in the folder &bbackup&f and named &b%fileName%'
      set-max-page: '%prefix%&e%player%''s max page&f is set to &e%number%&f.'
      add-max-page: '%prefix%&fAdded &e%number%&f max page number&f to &e%player%&f.'
      remove-max-page: '%prefix%&fRemoved &e%number%&f max page number&f from &e%player%&f.'
    setpageslot:
      messages:
        - ' '
        - '&#00ff8cInventoryPagesPlus'
        - '&7Version %version%'
        - ' '
        - '&#00ff8c/setpageslot nextpage &6<slot> &7- &fSet the slot of next page item'
        - '&#00ff8c/setpageslot prevpage &6<slot> &7- &fSet the slot of previous page item'
        - '&#00ff8c/setpageslot reset &7- &fReset the slots to the server''s setting default'
        - ' '
        - ' &6<>&7: Cannot leave this block blank &7| &e()&7: Can leave this block blank'
      page-slot-mismatch:
        next-page: '%prefix%&#fc3103The slot number cannot be equal to &eNext Page&f.'
        prev-page: '%prefix%&#fc3103The slot number cannot be equal to &ePrevious Page&f.'
      slot-range-error: '%prefix%&#fc3103The slot number cannot be below 0 and above 26.'
      empty-slot-request: '%prefix%&#fc3103Please empty the slot number &e%slotNumber%&#fc3103.'
      no-change-reset: '%prefix%&#fc3103Nothing change, reject changing.'
      next-page-slot-set: '%prefix%&fSuccessfully set the slot number for &eNext Page&f to &a%slotNumber%&f.'
      prev-page-slot-set: '%prefix%&fSuccessfully set the slot number for &ePrevious Page&f to &a%slotNumber%&f.'
      reset-page-slot-number: '%prefix%&fSuccessfully reset the slot page numbers.'
    invsee:
      messages:
        - ' '
        - '&#00ff8cInventoryPagesPlus'
        - '&7Version %version%'
        - ' '
        - '&#00ff8c/invsee &6<player> &7- &fSee player''s inventory'
        - ' '
        - ' &6<>&7: Cannot leave this block blank &7| &e()&7: Can leave this block blank'
      no-offline-invsee-permission: '%prefix%&#fc3103You need to have permission &einventorypagesplus.invsee.offline&#fc3103 to view offline player''s inventory.'
    clear:
      clear: '%prefix%&fCleared the items in the current page successfully &7(You can also use /clearall if you want to clear all items in all pages).'
      clear-target: '%prefix%&fClear the items in &e%player%''s&f current page successfully.'
      clear-targets-message: '%prefix%&fYour items in current page just got removed by &e%player%&f.'
      clear-all: '%prefix%&fCleared the items in all pages successfully!'
      clear-all-target: '%prefix%&fClear all pages of &e%player%&f successfully.'
      clear-all-targets-message: '%prefix%&fYour items in all pages just got removed by &e%player%&f.'
    history:
      date-usage: '%prefix%&#fc3103Usage: /invhistory <player> [%date_format%] [page] | /invhistory save [player]'
      disabled: '%prefix%&#fc3103Inventory history is disabled.'
      no-permission: '%prefix%&#fc3103You do not have permission to use inventory history.'
      no-permission-others: '%prefix%&#fc3103You do not have permission to view other players'' history.'
      no-history: '%prefix%&#fc3103No active history found for &e%player% &#fc3103in the requested date range. Expired records are not shown in the GUI.'
      loading: '%prefix%&#FFCC00Loading history...'
      load-failed: '%prefix%&#fc3103Could not load history. Please try again later.'
      saved: '%prefix%&#55ff00History saved for &e%player%&#55ff00.'
      save-failed: '%prefix%&#fc3103Could not save history for &e%player%&#fc3103.'
      save-all-started: '%prefix%&#FFCC00Saving history for all &e%total% &#FFCC00online players...'
      save-all-complete: '%prefix%&#55ff00History save finished: &e%saved%/%total% &#55ff00saved, &c%failed% &#55ff00failed.'
      save-all-running: '%prefix%&#FFCC00A save for all online players is already running.'
      save-all-empty: '%prefix%&7There are no online players to save.'
      restore-disabled: '%prefix%&#fc3103Restore is disabled in config.yml.'
      restore-state-no-permission: '%prefix%&#fc3103You do not have permission to restore inventory history.'
      restore-state-success: '%prefix%&#55ff00Restored inventory state for &e%player%&#55ff00.'
      restore-state-failed: '%prefix%&#fc3103Could not restore inventory state. The player may be protected or offline.'
      copy-disabled: '%prefix%&#fc3103Copying history items is disabled in config.yml.'
      copy-no-permission: '%prefix%&#fc3103You do not have permission to copy history items.'
      copy-success: '%prefix%&#55ff00Copied &e%amount%x %item% &#55ff00from the history of &e%player%&#55ff00.'
      copy-failed: '%prefix%&#fc3103Could not copy this item. Please try again.'
      copy-hint: '&#55ff00Click an item to copy it; history stays unchanged.'
      extract-view-only: '&#fc3103This view is read-only for you.'
      player-not-found: '%prefix%&#fc3103Player &e%player% &#fc3103was not found.'
      invalid-page: '%prefix%&#fc3103Invalid page number.'
      invalid-date: '%prefix%&#fc3103Invalid date. Expected format: %date_format%.'
      no-more: '%prefix%&7No further history in this direction, or data is currently unavailable.'
    protection:
      messages:
        - ' '
        - '&#00ff8cInventoryPagesPlus &7- &fPage protection'
        - ' '
        - '&#00ff8c/pageprotect <pin> &7- &fUnlock your inventory pages'
        - '&#00ff8c/pageprotect set <pin> <confirm> &7- &fSet a PIN'
        - '&#00ff8c/pageprotect change <old> <new> <confirm> &7- &fChange your PIN'
        - '&#00ff8c/pageprotect remove <pin> &7- &fRemove the protection'
        - '&#00ff8c/pageprotect lock &7- &fLock your inventory pages'
        - '&#00ff8c/pageprotect status &7- &fShow the protection status'
        - ' '
        - ' &6<>&7: Required &7| &e()&7: Optional'
      admin-messages:
        - '&#00ff8c/pageprotect admin ban <player> [reason] &7- &fForce-lock a player''s pages'
        - '&#00ff8c/pageprotect admin unban <player> [reason] &7- &fUnlock a force-locked player'
        - '&#00ff8c/pageprotect admin set <player> <pin> &7- &fSet a new PIN for a player'
        - '&#00ff8c/pageprotect admin reset <player> &7- &fReset a player''s protection'
      disabled: '%prefix%&#fc3103Page protection is disabled.'
      not-set: '%prefix%&#fc3103You have not set a PIN yet.'
      already-set: '%prefix%&#fc3103You already have a PIN. Use &e/pageprotect remove <pin>&#fc3103 to remove it first.'
      invalid-pin: '%prefix%&#fc3103The PIN must be %min%-%max% digits.'
      pin-mismatch: '%prefix%&#fc3103The confirmation PIN does not match.'
      wrong-pin: '%prefix%&#fc3103Wrong PIN. You have &e%attempts%&#fc3103 attempt(s) left.'
      banned: '%prefix%&#fc3103Too many wrong PINs. Try again in &e%minutes%m %seconds%s&#fc3103.'
      unlocked: '%prefix%&aYour inventory pages are now unlocked.'
      locked: '%prefix%&eYour inventory pages are now locked.'
      locked-reminder: '%prefix%&#fc3103Your inventory pages are locked. Use &e/pageprotect <pin>&#fc3103 to unlock.'
      already-unlocked: '%prefix%&eYour inventory pages are already unlocked.'
      set-success: '%prefix%&aYou have set a PIN for your inventory pages.'
      change-success: '%prefix%&aYour PIN has been changed.'
      remove-success: '%prefix%&aThe protection has been removed.'
      status-none: '%prefix%&fYou have not protected your inventory pages.'
      status-locked: '%prefix%&fYour inventory pages are &clocked&f.'
      status-unlocked: '%prefix%&fYour inventory pages are &aunlocked&f.'
      admin-reset: '%prefix%&fReset the protection of &e%player%&f.'
      admin-reset-target: '%prefix%&fYour page protection was reset by &e%player%&f.'
      admin-ban: '%prefix%&fForce-locked the inventory pages of &e%player%&f. Reason: &e%reason%&f.'
      admin-ban-target: '%prefix%&#fc3103An administrator locked your inventory pages. Reason: &e%reason%'
      admin-unban: '%prefix%&fUnlocked the inventory pages of &e%player%&f. Reason: &e%reason%&f.'
      admin-unban-target: '%prefix%&aAn administrator unlocked your inventory pages.'
      admin-set: '%prefix%&fSet a new protection PIN for &e%player%&f.'
      admin-set-target: '%prefix%&eAn administrator set a new protection PIN for your pages.'
      admin-banned: '%prefix%&#fc3103Your inventory pages are locked by an administrator. Reason: &e%reason%'
      command-blocked: '%prefix%&#fc3103You cannot use &e/%command%&#fc3103 while your inventory pages are locked.'
      dialog:
        title: '&#00ff8cInventoryPagesPlus &7- &fPage protection'
        menu-body: '&7Choose what you want to do with your protection PIN.'
        button:
          set: '&aSet a PIN'
          change: '&eChange PIN'
          remove: '&cRemove PIN'
          lock: '&6Lock'
          status: '&bStatus'
        input:
          pin: '&ePIN'
          new-pin: '&eNew PIN'
          confirm-pin: '&eConfirm PIN'
        set-title: '&6Set a PIN'
        set-body: '&7Enter a new PIN and type it again to confirm.'
        unlock-title: '&6Unlock your pages'
        unlock-body: '&7Enter your PIN to unlock your inventory pages.'
        change-title: '&6Change your PIN'
        change-body: '&7Enter your current PIN, the new PIN and the new PIN again.'
        remove-title: '&cRemove the protection'
        remove-body: '&7Enter your PIN to remove the protection.'
        confirm: '&aConfirm'
        cancel: '&cCancel'
    page-jump:
      prompt: '%prefix%&eType a page number in chat (&71-%max%&e), or send anything else to cancel.'
      none: '%prefix%&eShift+click a page navigation button first.'
      invalid: '%prefix%&#fc3103Invalid page number. Use a number between &e%min% &#fc3103and &e%max%&#fc3103.'
      success: '%prefix%&aJumped to page &e%page%&a.'
      dialog:
        title: '&#00ff8cInventoryPagesPlus &7- &fJump to page'
        body: '&7Type the page number you want to go to.'
        input-page: '&ePage'
        confirm: '&aJump'
        cancel: '&cCancel'
    autofix:
      completed: '%prefix%&#55ff00AutoFix replaced &e%amount% &#55ff00old item(s) in your inventory and pages.'
      disabled: '%prefix%&#fc3103AutoFix is disabled. Use &e/inventorypagesplus autofix toggle&#fc3103 to enable it.'
      reloaded: '%prefix%&fReloaded the AutoFix settings and rules.'
      toggled-on: '%prefix%&#55ff00AutoFix is now &aenabled&#55ff00.'
      toggled-off: '%prefix%&#FFCC00AutoFix is now &cdisabled&#FFCC00.'
      force-done: '%prefix%&fFixed &e%amount%&f item(s) for &e%player%&f.'
      force-all-started: '%prefix%&#FFCC00Force-fixing &e%total% &#FFCC00online player(s)...'
      force-all-complete: '%prefix%&#55ff00Force-fix finished: &e%fixed% &#55ff00item(s) replaced for &e%total% &#55ff00player(s).'
      force-all-running: '%prefix%&#FFCC00A force-fix for all online players is already running.'
      force-all-empty: '%prefix%&7There are no online players to fix.'
      rule-added: '%prefix%&#55ff00Saved the fix rule &e%key%&#55ff00. Everyone will be scanned again.'
      rule-deleted: '%prefix%&#55ff00Deleted the fix rule &e%key%&#55ff00. Everyone will be scanned again.'
      rule-invalid-old: '%prefix%&#fc3103The old item is missing or has no custom name.'
      rule-invalid-new: '%prefix%&#fc3103Please put the replacement item into the new item slot.'
      rules-added: '%prefix%&#55ff00Saved &e%amount% &#55ff00fix rule(s). Everyone will be scanned again.'
      rule-invalid-old-pair: '%prefix%&#fc3103Column &e%pair%&#fc3103: the old item is missing or has no custom name.'
      rule-invalid-new-pair: '%prefix%&#fc3103Column &e%pair%&#fc3103: please put the replacement item below it.'
      item-updated: '%prefix%&#55ff00Updated item: &f%item%'
      bypass-on: '%prefix%&#FFCC00You are now bypassing AutoFix. Your items will not be fixed.'
      bypass-off: '%prefix%&#55ff00You are no longer bypassing AutoFix.'
      bypass-on-other: '%prefix%&#FFCC00%player% is now bypassing AutoFix.'
      bypass-off-other: '%prefix%&#55ff00%player% is no longer bypassing AutoFix.'