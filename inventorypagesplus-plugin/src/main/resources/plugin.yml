name: InventoryPagesPlus
version: '${project.version}'
main: me.cortezromeo.inventorypagesplus.InventoryPagesPlus
api-version: '1.16'
softdepend:
  - PlaceholderAPI
authors:
  - Cortez_Romeo
  - hongminh54
description: Add pages to inventories for expansive storage!
commands:
  inventorypagesplus:
    description: Main command
    aliases:
      - inventorypages
      - inventorypage
      - inventorypages+
      - inventoryp
      - ipp
  clear:
    description: Clear current page
    aliases:
      - clearinventory
      - clearpage
      - clearcurrentpage
      - ci
  clearall:
    description: Clear all pages
    aliases:
      - clearallinventory
      - clearallpages
  setpageslot:
    description: Set pages' item slot
  invsee:
    description: See inventory of other players
  invhistory:
    description: View inventory page history of a player
    aliases:
      - pagehistory
  pageprotect:
    description: Protect your inventory pages with a PIN
    permission: inventorypagesplus.protect
    aliases:
      - baove
  pagejump:
    description: Jump to a page after shift+clicking a page navigation button
permissions:
  inventorypagesplus.protect:
    description: Use the page protection commands
    default: true
  inventorypagesplus.protect.admin:
    description: Use the admin page protection sub-commands
    default: op
  inventorypagesplus.protect.bypass:
    description: Never have inventory pages locked by the PIN protection
    default: op
  inventorypagesplus.autofix.bypass:
    description: Never have your items changed by AutoFix
    default: op
  inventorypagesplus.history:
    description: Allows viewing inventory page history
    default: op
  inventorypagesplus.history.others:
    description: Allows viewing history of other players
    default: op
  inventorypagesplus.history.save:
    description: Allows creating a manual snapshot
    default: op
  inventorypagesplus.history.restore:
    description: Allows restoring a snapshot
    default: op
  inventorypagesplus.invsee.admin:
    description: Allows taking and giving items through the invsee GUI
    default: op
  inventorypagesplus.invsee.take:
    description: Allows taking items from other players' inventories through the invsee GUI
    default: op
  inventorypagesplus.invsee.give:
    description: Allows putting items into other players' inventories through the invsee GUI
    default: op
